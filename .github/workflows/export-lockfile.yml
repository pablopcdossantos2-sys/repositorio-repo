name: Generate package-lock artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-lockfile.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    name: Resolve and commit npm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Regenerate lockfile from package.json
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const p=require('./package-lock.json'); for (const key of ['node_modules/fast-uri','node_modules/sisteransi','node_modules/playwright']) if (!p.packages[key]) throw new Error('Missing expected dependency: '+key); console.log('Resolved packages:', Object.keys(p.packages).length)"
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: package-lock-json
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already up to date."
          else
            git commit -m "build: regenerate npm lockfile"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
