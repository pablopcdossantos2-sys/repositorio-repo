name: Generate package-lock artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Resolve and export npm lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: Generate lockfile without installing packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Upload lockfile for review
        uses: actions/upload-artifact@v7
        with:
          name: package-lock-json
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
