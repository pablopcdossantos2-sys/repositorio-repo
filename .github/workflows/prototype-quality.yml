name: Prototype quality checks

on:
  push:
    branches: [main]
    paths:
      - "produto/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".nvmrc"
      - ".htmlvalidate.json"
      - ".github/workflows/prototype-quality.yml"
  pull_request:
    branches: [main]
    paths:
      - "produto/**"
      - "scripts/**"
      - "tests/**"
      - "package.json"
      - ".nvmrc"
      - ".htmlvalidate.json"
      - ".github/workflows/prototype-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Static checks for the web prototype
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
      - name: Install pinned development dependencies
        run: npm install --no-audit --no-fund
      - name: Run syntax, structural and HTML validation
        run: |
          npm run check:syntax
          npm run check:static
          npm run check:html
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser and axe-core tests
        run: npm run test:e2e
